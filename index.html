      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

      padding: 100px 20px;

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {

    }

      max-width: 800px;
      margin: 0 auto;
    }

<body>
  <section class="hero">
    <div class="container">
      <h1>Hromada Príbehov</h1>
      <p>Kde sa prelínajú svety.</p>

  </section>

</html>
